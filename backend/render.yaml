services:
  - type: web
    name: habitus-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm ci
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: habitus-mysql
          property: connectionString
